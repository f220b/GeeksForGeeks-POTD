name: Update GFG Stats in README

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 3:00 AM UTC
  workflow_dispatch: {}     # allows manual "Run workflow" trigger
  push:
    branches: [main]

permissions:
  contents: write

# Prevent overlapping runs (e.g. a manual run + the cron firing at the same
# time, or two pushes in quick succession) from racing to push at once.
concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Update stats in README
        run: python scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "chore: update GFG stats [automated]"

          # Retry push a few times in case the remote moved in the meantime
          # (e.g. another commit landed on main between checkout and push).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i). Rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done

          echo "Failed to push after multiple retries."
          exit 1
